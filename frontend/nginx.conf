server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 200m;

    location /api/ {
        proxy_pass http://backend:8090;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # spa routes
    location / {
        try_files $uri /index.html;
    }
}
