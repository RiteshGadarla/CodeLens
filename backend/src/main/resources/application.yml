spring:
  application:
    name: codelens
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:codelens}?reWriteBatchedInserts=true
    username: ${POSTGRES_USER:codelens}
    password: ${POSTGRES_PASSWORD:codelens}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.batch_size: 500
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    redis:
      time-to-live: 30m
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

server:
  port: ${SERVER_PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

codelens:
  repos-dir: ${REPOS_DIR:./data/repos}
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    timeout: 120s
    enabled: true
  analysis:
    parallelism: 8
    max-file-bytes: 1048576
  cors:
    allowed-origins:
      - http://localhost:5173
