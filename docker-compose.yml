services:
  postgres:
    image: postgres:16-alpine
    env_file: ./backend/.env
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  ai-service:
    build: ./ai-service
    env_file: ./ai-service/.env
    environment:
      DATA_DIR: /app/data
    volumes: [aidata:/app/data]

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      AI_SERVICE_URL: http://ai-service:8000
      REPOS_DIR: /var/codelens/repos
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["8090:8090"]
    volumes: [repos:/var/codelens/repos]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["5173:80"]

volumes:
  pgdata:
  aidata:
  repos:
